    <text x="1060" y="190" font-size="24" fill="#d9d4ff">slash commands</text>
    <text x="1060" y="228" font-size="18" fill="#b9acff">Claude · ChatGPT · Gemini</text>
    <text x="1060" y="254" font-size="18" fill="#b9acff">Flow · Kling · Midjourney</text>
